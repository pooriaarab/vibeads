name: oxlint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Cancel a superseded PR run, but never a push to the default branch —
# that run is the record of what landed on main.
concurrency:
  group: oxlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # bunx runs downloaded package code; keep the token out of .git/config.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: oxlint (agent budgets — enforced, violations fail the build)
        run: bunx oxlint@^1 --config .oxlintrc.json
